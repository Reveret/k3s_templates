name: Publish Helm charts

on:
  push:
    branches:
      - main
    paths:
      - helm/public-helm-charts/charts/**
      - .github/workflows/publish-helm-charts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Initialize GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git branch gh-pages "${GITHUB_SHA}"
            git push origin gh-pages
          fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Release versioned charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm/public-helm-charts/charts
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
