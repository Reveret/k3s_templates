{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "database-with-backup.secretName" . }}
  labels:
    {{- include "database-with-backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_DATABASE: {{ .Values.database.name | quote }}
  MARIADB_USER: {{ .Values.auth.username | quote }}
  MARIADB_PASSWORD: {{ .Values.auth.password | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.auth.rootPassword | quote }}
{{- end }}
