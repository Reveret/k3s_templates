apiVersion: v1
kind: Service
metadata:
  name: {{ include "database-with-backup.fullname" . }}
  labels:
    {{- include "database-with-backup.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "database-with-backup.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
      protocol: TCP
