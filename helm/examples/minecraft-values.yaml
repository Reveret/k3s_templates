replicaCount: 1

image:
  repository: itzg/minecraft-server
  tag: java21
  pullPolicy: IfNotPresent

env:
  - name: EULA
    value: "TRUE"

containerPorts:
  - name: minecraft
    containerPort: 25565
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP

persistence:
  enabled: true
  size: 10Gi
  mounts:
    - mountPath: /data

startupProbe:
  tcpSocket:
    port: minecraft
  periodSeconds: 10
  failureThreshold: 30

readinessProbe:
  tcpSocket:
    port: minecraft
  periodSeconds: 10
  failureThreshold: 6
